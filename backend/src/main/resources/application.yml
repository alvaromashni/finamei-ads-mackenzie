spring:
  application:
    name: finamei-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finamei}
    username: ${DB_USER:finamei}
    password: ${DB_PASSWORD:finamei}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
