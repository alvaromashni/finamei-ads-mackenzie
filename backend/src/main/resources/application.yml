spring:
  application:
    name: finamei-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finamei}
    username: ${DB_USER:finamei}
    password: ${DB_PASSWORD:finamei}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # Inserções em lote (ex.: as 12 guias do DAS vão em uma instrução, não em doze).
        # Sem order_inserts: as entidades referenciam umas às outras só por UUID (sem associações
        # mapeadas), então reordenar inserts por tipo quebraria as chaves estrangeiras.
        jdbc.batch_size: 25
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:finamei-local-dev-jwt-secret-do-not-use-in-production-1234567890}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://finamei-ads-mackenzie.vercel.app}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

finamei:
  auth:
    # RN09: bloqueio após N falhas seguidas de login, por M minutos.
    max-failed-attempts: ${LOGIN_MAX_FAILED_ATTEMPTS:5}
    lock-minutes: ${LOGIN_LOCK_MINUTES:15}
  revenue:
    annual-limit: 81000.00
    attention-percent: 80
    critical-percent: 90
  das:
    # Valor mensal da guia DAS do MEI; atualizar quando o valor oficial mudar.
    monthly-amount: ${DAS_MONTHLY_AMOUNT:76.90}
