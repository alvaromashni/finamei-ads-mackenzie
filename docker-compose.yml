services:
  db:
    image: postgres:16-alpine
    container_name: finamei-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finamei}
      POSTGRES_USER: ${POSTGRES_USER:-finamei}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finamei}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - finamei_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  finamei_postgres_data:
